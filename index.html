<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kokusai Ops</title>
  <link rel="stylesheet" href="static/css/style.css" />
</head>
<body>
  <main class="login-page">
    <section class="login-shell">
      <div class="login-card">
        <div class="login-brand">
          <img src="static/images/kokusai-logo.webp" alt="Logo Kokusai" class="login-logo" />
          <div>
            <p class="brand-kicker">Kokusai Ops</p>
            <h1>Projeto Flask</h1>
            <span>Este arquivo é apenas um aviso local.</span>
          </div>
        </div>
        <p class="login-hint">
          Para usar o painel com login, compras, vendas, encomendas e craft, execute o servidor Flask:
          <br><br>
          <span>python main.py</span>
          <br><br>
          Depois acesse <span>http://localhost:5000</span> no navegador.
        </p>
      </div>
    </section>
  </main>
</body>
</html>
